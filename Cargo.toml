[package]
name = "rust-renderer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust-renderer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["derive"] }
cgmath = { version = "0.18.0", features=["swizzle"] }
env_logger = "0.11.9"
futures = "0.3.32"
gfx-hal = "0.9.0"
image = "0.25.9"
log = "0.4.29"
pollster = "0.4.0"
rand = "0.10.0"
wgpu = "29.0.1"
winit = "0.30.13"
egui-wgpu = { version = "0.34.1", features = ["winit"] }
egui-winit = "0.34.1"
egui = "0.34.1"
